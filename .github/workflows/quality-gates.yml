name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - 'remediation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: VNext Chromium and PDF proofs
        run: |
          node tests/vnext/proof/editor-text-proof.mjs
          node tests/vnext/proof/editor-direct-manipulation-proof.mjs
          node tests/vnext/proof/editor-snapping-diagnostics-proof.mjs
          node tests/vnext/proof/editor-template-insertion-proof.mjs
          node tests/vnext/proof/editor-group-proof.mjs
          node tests/vnext/proof/group-export-proof.mjs
          node tests/vnext/proof/export-proof.mjs
