name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - 'remediation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium and Microsoft Edge
        run: npx playwright install --with-deps chromium msedge

      - name: VNext Chromium and PDF proofs
        run: |
          node tests/vnext/proof/editor-text-proof.mjs
          node tests/vnext/proof/editor-direct-manipulation-proof.mjs
          node tests/vnext/proof/editor-asset-insert-proof.mjs
          node tests/vnext/proof/editor-snapping-diagnostics-proof.mjs
          node tests/vnext/proof/editor-template-insertion-proof.mjs
          node tests/vnext/proof/editor-group-proof.mjs
          node tests/vnext/proof/group-export-proof.mjs
          node tests/vnext/proof/export-proof.mjs
          node tests/vnext/proof/w3g-asset-persistence-proof.mjs
          node tests/vnext/proof/w3h-autosave-concurrency-proof.mjs
          node tests/vnext/proof/w3i-father-browser-flow-proof.mjs
          node tests/vnext/proof/editor-table-axis-proof.mjs
          node tests/vnext/proof/editor-table-cell-proof.mjs
          node tests/vnext/proof/editor-table-merge-proof.mjs
          node tests/vnext/proof/editor-table-bulk-proof.mjs
          node tests/vnext/proof/editor-table-fit-height-proof.mjs
          node tests/vnext/proof/editor-table-professional-dimensions-proof.mjs
          node tests/vnext/proof/editor-table-professional-style-proof.mjs
          node tests/vnext/proof/editor-table-semantic-content-proof.mjs
          node tests/vnext/proof/editor-standalone-image-professional-authoring-proof.mjs
          node tests/vnext/proof/editor-object-arrangement-locking-proof.mjs
          node tests/vnext/proof/editor-w4-wave4-closeout-proof.mjs
          node tests/vnext/proof/productization-p1a-workspace-proof.mjs
          node tests/vnext/proof/productization-p1b-contextual-inspector-proof.mjs
          node tests/vnext/proof/productization-p1c-product-coherence-proof.mjs
          node tests/vnext/proof/w5a-semantic-translation-foundation-proof.mjs
          node tests/vnext/proof/pilot-a-authorship-trust-proof.mjs
          node tests/vnext/proof/pilot-b-access-entry-proof.mjs
          node tests/vnext/proof/l1-authority-loss-proof.mjs

      - name: C.1 official starter Chromium proof
        run: node tests/vnext/proof/pilot-c1-official-starter-proof.mjs

      - name: W5.B translation review and copy Chromium proof
        run: node tests/vnext/proof/w5b-translation-review-copy-proof.mjs

      - name: W5.C canonical publication review Chromium and PDF proof
        run: node tests/vnext/proof/w5c-publication-review-proof.mjs

      - name: P2 multilingual Translation Center Chromium and PDF proof
        run: node tests/vnext/proof/p2-multilingual-translation-center-proof.mjs

      - name: Father large catalog and table publication proof
        run: node tests/vnext/proof/father-large-catalog-proof.mjs

      - name: Father translation batching and partial failure proof
        run: node tests/vnext/proof/father-translation-batching-proof.mjs

      - name: AI-first prototype production Chromium, Edge and PDF proof
        env:
          AI_PROOF_PRODUCTION: '1'
          AI_PROOF_OUTPUT: scratch/ai-catalog-production
        run: |
          node tests/vnext/proof/ai-catalog-prototype-proof.mjs
          AI_PROOF_BROWSER=msedge node tests/vnext/proof/ai-catalog-prototype-proof.mjs

      - name: Six model physically split A4 technical tables, zero lost values
        run: node tests/vnext/proof/six-model-comparison-browser-proof.mjs

      - name: Upload six-model A4 publication receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: six-model-tables-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: scratch/six-model-a4-proof/
          if-no-files-found: warn
          retention-days: 30

      - name: Two-turn Gemini clarification and approved follow-up browser proof (mock)
        run: node tests/vnext/proof/gemini-multiturn-browser-proof.mjs

      - name: Preserve Gemini multi-turn acceptance receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gemini-multiturn-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: scratch/gemini-multiturn-browser-proof/
          if-no-files-found: warn
          retention-days: 30

      - name: Check disabled-by-default Gemini composer Edge TS syntax
        run: node -e "const fs=require('fs'); const esbuild=require('esbuild'); esbuild.transformSync(fs.readFileSync('supabase/functions/vnext-catalog-composer/index.ts','utf8'),{loader:'ts',target:'es2022',format:'esm'}); console.log('COMPOSER_SYNTAX_PASS')"

      - name: Inline assistant UX on the actual VNext editor, desktop and narrow browser
        run: node tests/vnext/proof/inline-assistant-browser-proof.mjs

      - name: Preserve inline assistant browser UX screenshots and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inline-assistant-ux-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: scratch/inline-assistant-ux-proof/
          if-no-files-found: warn
          retention-days: 30

      - name: BYOK agent conversation to native A4 PDF, mock transport only
        run: node tests/vnext/proof/byok-agent-conversation-browser-proof.mjs

      - name: Upload bounded BYOK agent dialogue and A4 PDF evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byok-agent-dialogue-pdf-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: scratch/byok-agent-conversation-proof/
          if-no-files-found: warn
          retention-days: 30

      - name: Institutional 27-page technical catalog, controlled Gemini intent, saved catalog and PDF proof
        env:
          LONG_PROOF_SECTIONS: '12'
          LONG_PROOF_INSTITUTIONAL: '1'
          LONG_PROOF_REFINE: '1'
          LONG_PROOF_PRODUCTION: '1'
          LONG_PROOF_PORT: '5364'
        run: node tests/vnext/proof/long-institutional-catalog-proof.mjs

      - name: Upload institutional PDF and cell geometry receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: institutional-long-pdf-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: scratch/long-institutional-a4/12x16-premium/
          if-no-files-found: warn
          retention-days: 30

      - name: Device local BYOK vault crypto / unlock / reload / deletion proof
        run: node tests/vnext/proof/provider-byok-device-proof.mjs

      - name: Upload provider credential vault browser receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byok-provider-device-vault
          path: scratch/provider-local-byok-proof/
          if-no-files-found: warn
          retention-days: 30

      - name: Browser local PDF upload, indexed source, fail-closed invalid PDF
        if: always()
        run: node tests/vnext/proof/real-pdf-local-index-proof.mjs

      - name: Upload local native PDF intake proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-pdf-local-intake-proof
          path: scratch/real-pdf-local-index/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AI-first prototype proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-catalog-prototype-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: scratch/ai-catalog-production/
          if-no-files-found: warn
          retention-days: 30

      - name: Advanced technical table matrix Chromium, Edge and PDF proof
        run: node tests/vnext/proof/advanced-table-matrix-proof.mjs

      - name: Preserve advanced table proof receipts and PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-technical-tables-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: scratch/advanced-table-matrix-proof/
          if-no-files-found: warn
          retention-days: 30
