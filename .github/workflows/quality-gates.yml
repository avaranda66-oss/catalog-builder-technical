name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - 'remediation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
