name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main
      - 'remediation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gates:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: VNext Chromium and PDF proofs
        run: |
          node tests/vnext/proof/editor-text-proof.mjs
          node tests/vnext/proof/editor-direct-manipulation-proof.mjs
          node tests/vnext/proof/editor-asset-insert-proof.mjs
          node tests/vnext/proof/editor-snapping-diagnostics-proof.mjs
          node tests/vnext/proof/editor-template-insertion-proof.mjs
          node tests/vnext/proof/editor-group-proof.mjs
          node tests/vnext/proof/group-export-proof.mjs
          node tests/vnext/proof/export-proof.mjs
          node tests/vnext/proof/w3g-asset-persistence-proof.mjs
          node tests/vnext/proof/w3h-autosave-concurrency-proof.mjs
          node tests/vnext/proof/w3i-father-browser-flow-proof.mjs
          node tests/vnext/proof/editor-table-axis-proof.mjs
          node tests/vnext/proof/editor-table-cell-proof.mjs
          node tests/vnext/proof/editor-table-merge-proof.mjs
          node tests/vnext/proof/editor-table-bulk-proof.mjs
          node tests/vnext/proof/editor-table-fit-height-proof.mjs
          node tests/vnext/proof/editor-table-professional-dimensions-proof.mjs
          node tests/vnext/proof/editor-table-professional-style-proof.mjs
          node tests/vnext/proof/editor-table-semantic-content-proof.mjs
          node tests/vnext/proof/editor-standalone-image-professional-authoring-proof.mjs
          node tests/vnext/proof/editor-object-arrangement-locking-proof.mjs
          node tests/vnext/proof/editor-w4-wave4-closeout-proof.mjs
          node tests/vnext/proof/productization-p1a-workspace-proof.mjs
          node tests/vnext/proof/productization-p1b-contextual-inspector-proof.mjs
          node tests/vnext/proof/w5a-semantic-translation-foundation-proof.mjs
          node tests/vnext/proof/pilot-a-authorship-trust-proof.mjs
          node tests/vnext/proof/pilot-b-access-entry-proof.mjs
          node tests/vnext/proof/l1-authority-loss-proof.mjs

      - name: C.1 official starter Chromium proof
        run: node tests/vnext/proof/pilot-c1-official-starter-proof.mjs

      - name: W5.B translation review and copy Chromium proof
        run: node tests/vnext/proof/w5b-translation-review-copy-proof.mjs

      - name: W5.C canonical publication review Chromium and PDF proof
        run: node tests/vnext/proof/w5c-publication-review-proof.mjs
