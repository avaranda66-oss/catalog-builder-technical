name: DB.RELEASE0.2 — Disposable Supabase Rehearsal

on:
  push:
    branches:
      - ops/db-release0-ci-rehearsal
  workflow_dispatch:

jobs:
  rehearsal:
    name: Rehearsal Execution & Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Environment Diagnostics
        run: |
          echo "=== DOCKER VERSION ==="
          docker version
          echo "=== NODE VERSION ==="
          node --version
          echo "=== NPM VERSION ==="
          npm --version

      - name: Install Dependencies
        run: |
          npm install --no-save pg @types/pg
          npm install --no-save supabase@2.116.0
          echo "=== SUPABASE CLI VERSION ==="
          npx supabase --version

      - name: Setup Migration Boundary (Isolate Target 00022 and Historical 00005-00021)
        run: |
          mkdir -p target_migration pending_migrations
          # 1. Isolate target migration 00022
          cp supabase/migrations/00022_product_workbook_persistence.sql target_migration/00022_product_workbook_persistence.sql
          rm supabase/migrations/00022_product_workbook_persistence.sql
          # 2. Isolate migrations 00005 through 00021 so initial stack starts on 00001-00004
          mv supabase/migrations/0000[5-9]* pending_migrations/ || true
          mv supabase/migrations/0001* pending_migrations/ || true
          mv supabase/migrations/0002* pending_migrations/ || true
          echo "Active initial baseline migrations (00001-00004):"
          ls -la supabase/migrations/

      - name: Start Disposable Supabase Stack (Base 00001 - 00004)
        run: |
          npx supabase start
          echo "=== SUPABASE STATUS ==="
          npx supabase status

      - name: Apply Live-Derived Rehearsal Baseline Bridge
        run: |
          echo "Applying live-derived baseline bridge (media_library)..."
          node -e "import pg from 'pg'; import fs from 'fs'; const c = new pg.Client({ connectionString: 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' }); await c.connect(); await c.query(fs.readFileSync('scripts/db-release0-live-baseline.sql', 'utf8')); await c.end(); console.log('Live-derived baseline bridge applied successfully');"

      - name: Apply Remaining Historical Migrations (00005 - 00021)
        run: |
          echo "Restoring historical migrations 00005-00021..."
          mv pending_migrations/*.sql supabase/migrations/
          ls -la supabase/migrations/
          echo "Applying pending migrations via supabase migration up..."
          npx supabase migration up --local

      - name: Restore Target Migration 00022 for Rehearsal Execution
        run: |
          cp target_migration/00022_product_workbook_persistence.sql supabase/migrations/00022_product_workbook_persistence.sql
          echo "Restored target migration 00022:"
          ls -la supabase/migrations/00022*
          sha256sum supabase/migrations/00022_product_workbook_persistence.sql

      - name: Run Full Rehearsal Verification Suite
        run: |
          node scripts/ci-db-rehearsal.js

      - name: Upload Rehearsal Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-release0-rehearsal-artifacts
          path: rehearsal_artifacts/
          if-no-files-found: warn

      - name: Cleanup Disposable Supabase
        if: always()
        run: |
          npx supabase stop --no-backup || true
